name: Cosmic Download Android Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cosmic-download-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: Configure repositories for Flutter Gradle plugins
        run: |
          settings="$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          python3 - "$settings" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          if not source.lstrip().startswith("pluginManagement {"):
              plugin_repositories = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          """
              path.write_text(plugin_repositories + source)
          PY
          grep -q 'mavenCentral()' "$settings"
      - name: Generate Android project scaffolding
        run: flutter create --platforms=android --org com.cosmicdownload --project-name cosmic_download .
      - name: Restore app sources and Android manifest
        run: |
          git checkout HEAD -- lib/main.dart pubspec.yaml android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/cosmicdownload/cosmic_download/MainActivity.kt
      - name: Install image conversion utility
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Apply uploaded frog launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            convert assets/cosmic_icon.jpg -resize "${2}x${2}^" -gravity center -extent "${2}x${2}" -strip "android/app/src/main/res/mipmap-${1}/ic_launcher.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Configure Android notification desugaring
        run: |
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          contents = gradle.read_text()
          release_block = '        release {\n'
          if contents.count(release_block) != 1:
              raise SystemExit('Could not safely locate the generated release build type.')
          hardening = '''        release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
          '''
          gradle.write_text(contents.replace(release_block, hardening, 1))
          PY
          cat > android/app/proguard-rules.pro <<'EOF'
          # yt-dlp-android uses Commons Compress ZipUtils to extract bundled Python.
          # Preserve reflective ZIP extra-field implementations from R8 rewriting.
          -keep class org.apache.commons.compress.** { *; }
          -dontwarn org.apache.commons.compress.**
          EOF
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -q 'targetSdk = 35' android/app/build.gradle.kts
          grep -q 'isMinifyEnabled = false' android/app/build.gradle.kts
          grep -Fq -- '-keep class org.apache.commons.compress.** { *; }' android/app/proguard-rules.pro
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
      - name: Configure native library packaging
        run: |
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/^android {/a\\    packaging { jniLibs { useLegacyPackaging = true } }' android/app/build.gradle.kts
      - name: Resolve packages
        run: flutter pub get
      - name: Remove generated template test
        run: |
          rm -f test/widget_test.dart
          rmdir test 2>/dev/null || true
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test download output resolution
        run: flutter test --no-pub test/download_output_resolver_test.dart
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-download-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Cosmic Download v1.2.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
